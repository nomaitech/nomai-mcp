[project]
name = "nomai-mcp"
version = "0.1.0"
description = "Nomai company MCP server (remote, OAuth 2.1 protected)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.28.1",
    "httpx>=0.28.1",
]

[project.scripts]
nomai-mcp = "nomai_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nomai_mcp"]
