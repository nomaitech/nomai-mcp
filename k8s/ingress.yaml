apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nomai-mcp
  namespace: jon
  labels:
    app: nomai-mcp
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/hostname: mcp.nomaitech.com
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - mcp.nomaitech.com
      secretName: nomai-mcp-tls
  rules:
    - host: mcp.nomaitech.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nomai-mcp
                port:
                  name: http
