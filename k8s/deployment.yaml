apiVersion: apps/v1
kind: Deployment
metadata:
  name: nomai-mcp
  namespace: jon
  labels:
    app: nomai-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nomai-mcp
  template:
    metadata:
      labels:
        app: nomai-mcp
    spec:
      # Otherwise Kubernetes injects Docker-links-style env vars for every
      # Service in the namespace, e.g. NOMAI_MCP_PORT=tcp://<ip>:80 — which
      # collides with and overrides our own NOMAI_MCP_PORT app setting.
      enableServiceLinks: false
      imagePullSecrets:
        - name: regcred
      containers:
        - name: nomai-mcp
          image: pdr.jonbesga.com/nomai-mcp:8c940c9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: nomai-mcp-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
